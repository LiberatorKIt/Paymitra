# Render Blueprint: in Render choose New > Blueprint and pick this repo.
# It creates the website AND a free database, wires them together, and asks
# you nothing. Add AI keys or a password later under the website's Environment tab.
databases:
  - name: paymitra-db
    plan: free
    region: singapore
    databaseName: paymitra
    user: paymitra

services:
  - type: web
    name: paymitra
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: paymitra-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CYCLE_TOKEN
        generateValue: true
      - key: LLM_MODE
        value: auto
      - key: TIMEZONE
        value: Asia/Kolkata
      # Optional, add in Render > paymitra > Environment when you have them:
      #   GEMINI_API_KEY, NVIDIA_API_KEY      switch the AI on
      #   APP_PASSWORD                        ask visitors for a password
      #   TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, OWNER_WHATSAPP   real WhatsApp
